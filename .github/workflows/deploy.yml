name: Deploy to GitHub Pages

# The built site (incl. product images, which are gitignored on main) lives on
# the gh-pages branch — this workflow deploys that branch via the Pages
# artifact path, bypassing the legacy Jekyll builder.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000 # 5.4k files deploy slowly; default 10 min gives up too early
